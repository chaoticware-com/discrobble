name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: release/metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Verify tag commit is contained in origin/main
        run: |
          git fetch --no-tags origin main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "::error::${GITHUB_REF_NAME} does not point to a commit contained in origin/main."
            exit 1
          fi

      - name: Generate release metadata artifact
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {
              "tag": os.environ["GITHUB_REF_NAME"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }

          Path("release-metadata.json").write_text(
              json.dumps(metadata, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload release metadata artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-metadata
          path: release-metadata.json

  worker-bundle:
    name: release/worker-bundle
    runs-on: ubuntu-latest
    needs:
      - metadata
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install workspace dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build deployable Worker bundle
        working-directory: backend/worker
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-worker-bundle"

          pnpm exec wrangler deploy \
            --dry-run \
            --outdir "$GITHUB_WORKSPACE/release-worker-bundle" \
            --metafile "$GITHUB_WORKSPACE/release-worker-bundle/bundle-meta.json"

      - name: Archive deployable Worker bundle
        run: |
          tar -czf release-worker-bundle.tgz -C release-worker-bundle .

      - name: Upload deployable Worker bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-worker-bundle
          path: |
            release-worker-bundle
            release-worker-bundle.tgz

  provenance:
    name: release/provenance
    runs-on: ubuntu-latest
    needs:
      - metadata
      - worker-bundle
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download release metadata artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-metadata
          path: release-metadata

      - name: Download deployable Worker bundle artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-worker-bundle
          path: release-worker

      - name: Validate release metadata contents
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path("release-metadata/release-metadata.json").read_text(encoding="utf-8"))

          assert metadata["tag"] == os.environ["GITHUB_REF_NAME"]
          assert metadata["commit_sha"] == os.environ["GITHUB_SHA"]
          assert metadata["workflow"] == os.environ["GITHUB_WORKFLOW"]
          assert metadata["run_id"] == os.environ["GITHUB_RUN_ID"]
          assert metadata["run_attempt"] == os.environ["GITHUB_RUN_ATTEMPT"]

          print("release metadata matches the current workflow context")
          PY

      - name: Verify deployable Worker bundle contents
        run: |
          required_paths=(
            release-worker/release-worker-bundle/index.js
            release-worker/release-worker-bundle/bundle-meta.json
            release-worker/release-worker-bundle.tgz
          )

          for required_path in "${required_paths[@]}"; do
            if [ ! -f "$required_path" ]; then
              echo "::error::Missing required release artifact: $required_path"
              exit 1
            fi
          done

      - name: Attest release metadata artifact
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: release-metadata/release-metadata.json

      - name: Attest deployable Worker bundle
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: release-worker/release-worker-bundle/index.js

      - name: Attest archived Worker release asset
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: release-worker/release-worker-bundle.tgz

  github-release:
    name: release/github
    runs-on: ubuntu-latest
    needs:
      - metadata
      - provenance
      - worker-bundle
    permissions:
      contents: write
    steps:
      - name: Download release metadata artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-metadata
          path: release-metadata

      - name: Download deployable Worker bundle artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-worker-bundle
          path: release-worker

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              release-metadata/release-metadata.json \
              release-worker/release-worker-bundle.tgz \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              release-metadata/release-metadata.json \
              release-worker/release-worker-bundle.tgz \
              --repo "$GITHUB_REPOSITORY" \
              --title "${GITHUB_REF_NAME}" \
              --notes "Phase 0 release workflow skeleton."
          fi

  worker-disabled:
    name: release/worker-disabled
    if: ${{ vars.ENABLE_WORKER_PROD_DEPLOY != 'true' }}
    runs-on: ubuntu-latest
    needs:
      - metadata
      - provenance
      - github-release
    steps:
      - name: Report gated production deployment
        run: |
          echo "Production Worker deployment remains disabled until ENABLE_WORKER_PROD_DEPLOY is set to true and the protected runtime secrets have been rotated through the manual rotate-worker-secrets workflow."

  worker:
    name: release/worker
    if: ${{ vars.ENABLE_WORKER_PROD_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - metadata
      - provenance
      - github-release
      - worker-bundle
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Verify production deployment prerequisites
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          required_files=(
            backend/worker/package.json
            backend/worker/wrangler.toml
          )

          for required_file in "${required_files[@]}"; do
            if [ ! -f "$required_file" ]; then
              echo "::error::Missing required production deploy file: $required_file"
              exit 1
            fi
          done

          required_secrets=(
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_API_TOKEN
          )

          for secret_name in "${required_secrets[@]}"; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing required production deploy secret: $secret_name"
              exit 1
            fi
          done

      - name: Download deployable Worker bundle artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-worker-bundle
          path: release-worker

      - name: Install workspace dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Deploy attested Worker bundle to production
        working-directory: backend/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bundle_path="${GITHUB_WORKSPACE}/release-worker/release-worker-bundle/index.js"

          if [ ! -f "$bundle_path" ]; then
            echo "::error::Missing deployable Worker bundle at $bundle_path"
            exit 1
          fi

          pnpm exec wrangler deploy "$bundle_path" \
            --no-bundle \
            --config wrangler.toml \
            --tag "${GITHUB_REF_NAME}" \
            --message "Release ${GITHUB_REF_NAME} (${GITHUB_SHA})"
