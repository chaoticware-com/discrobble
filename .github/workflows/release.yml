name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: release/metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Generate release metadata artifact
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {
              "tag": os.environ["GITHUB_REF_NAME"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }

          Path("release-metadata.json").write_text(
              json.dumps(metadata, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload release metadata artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-metadata
          path: release-metadata.json

  provenance:
    name: release/provenance
    runs-on: ubuntu-latest
    needs:
      - metadata
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download release metadata artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-metadata
          path: release-metadata

      - name: Validate release metadata contents
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path("release-metadata/release-metadata.json").read_text(encoding="utf-8"))

          assert metadata["tag"] == os.environ["GITHUB_REF_NAME"]
          assert metadata["commit_sha"] == os.environ["GITHUB_SHA"]
          assert metadata["workflow"] == os.environ["GITHUB_WORKFLOW"]
          assert metadata["run_id"] == os.environ["GITHUB_RUN_ID"]
          assert metadata["run_attempt"] == os.environ["GITHUB_RUN_ATTEMPT"]

          print("release metadata matches the current workflow context")
          PY

      - name: Attest release metadata artifact
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: release-metadata/release-metadata.json

  github-release:
    name: release/github
    runs-on: ubuntu-latest
    needs:
      - metadata
      - provenance
    permissions:
      contents: write
    steps:
      - name: Download release metadata artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-metadata
          path: release-metadata

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-metadata/release-metadata.json \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-metadata/release-metadata.json \
              --repo "$GITHUB_REPOSITORY" \
              --title "${GITHUB_REF_NAME}" \
              --notes "Phase 0 release workflow skeleton."
          fi

  worker:
    name: release/worker
    runs-on: ubuntu-latest
    needs:
      - metadata
      - provenance
      - github-release
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Verify production deployment prerequisites
        run: |
          if [ ! -f backend/worker/wrangler.toml ]; then
            echo "Production Worker deployment is intentionally gated until backend/worker is scaffolded."
            exit 0
          fi

      - name: Placeholder production deployment
        run: |
          echo "Replace this step with a Wrangler production deploy once deploy credentials and worker routes are wired."
