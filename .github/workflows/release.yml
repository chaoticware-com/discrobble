name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  deployments: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: release/metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate release metadata artifact
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {
              "tag": os.environ["GITHUB_REF_NAME"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }

          Path("release-metadata.json").write_text(
              json.dumps(metadata, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload release metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: release-metadata.json

  github-release:
    name: release/github
    runs-on: ubuntu-latest
    needs:
      - metadata
    steps:
      - name: Download release metadata artifact
        uses: actions/download-artifact@v4
        with:
          name: release-metadata

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-metadata.json --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-metadata.json \
              --title "${GITHUB_REF_NAME}" \
              --notes "Phase 0 release workflow skeleton."
          fi

  worker:
    name: release/worker
    runs-on: ubuntu-latest
    needs:
      - metadata
      - github-release
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify production deployment prerequisites
        run: |
          if [ ! -f backend/worker/wrangler.toml ]; then
            echo "Production Worker deployment is intentionally gated until backend/worker is scaffolded."
            echo "This workflow already reserves the production environment and tag-based release path."
            exit 0
          fi

      - name: Placeholder production deployment
        run: |
          echo "Replace this step with a Wrangler production deploy once backend/worker exists."
