name: Rotate Worker Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-secrets-production
  cancel-in-progress: false

jobs:
  production:
    name: worker/secrets
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Verify secret rotation prerequisites
        env:
          AUTH_STATE_SECRET: ${{ secrets.AUTH_STATE_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISCOGS_CONSUMER_KEY: ${{ secrets.DISCOGS_CONSUMER_KEY }}
          DISCOGS_CONSUMER_SECRET: ${{ secrets.DISCOGS_CONSUMER_SECRET }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          required_secrets=(
            AUTH_STATE_SECRET
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_API_TOKEN
            DISCOGS_CONSUMER_KEY
            DISCOGS_CONSUMER_SECRET
            LASTFM_API_KEY
            LASTFM_API_SECRET
          )

          for secret_name in "${required_secrets[@]}"; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing required production secret rotation value: $secret_name"
              exit 1
            fi
          done

      - name: Install workspace dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build Worker secret payload
        env:
          AUTH_ALLOWED_HTTPS_CALLBACK_PREFIXES: ${{ vars.AUTH_ALLOWED_HTTPS_CALLBACK_PREFIXES }}
          AUTH_STATE_SECRET: ${{ secrets.AUTH_STATE_SECRET }}
          DISCOGS_CONSUMER_KEY: ${{ secrets.DISCOGS_CONSUMER_KEY }}
          DISCOGS_CONSUMER_SECRET: ${{ secrets.DISCOGS_CONSUMER_SECRET }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def required_env(name: str) -> str:
              value = os.environ.get(name, "").strip()
              if not value:
                  raise RuntimeError(f"Missing required environment variable: {name}")
              return value

          payload_keys = [
              "AUTH_STATE_SECRET",
              "DISCOGS_CONSUMER_KEY",
              "DISCOGS_CONSUMER_SECRET",
              "LASTFM_API_KEY",
              "LASTFM_API_SECRET",
          ]
          payload = {key: required_env(key) for key in payload_keys}

          callback_prefixes = os.environ.get("AUTH_ALLOWED_HTTPS_CALLBACK_PREFIXES", "").strip()
          if callback_prefixes:
              payload["AUTH_ALLOWED_HTTPS_CALLBACK_PREFIXES"] = callback_prefixes

          output_path = Path(required_env("RUNNER_TEMP")) / "worker-secrets.json"
          output_path.write_text(json.dumps(payload), encoding="utf-8")

          with Path(required_env("GITHUB_ENV")).open("a", encoding="utf-8") as env_file:
              env_file.write(f"WORKER_SECRETS_FILE={output_path}\n")
          PY

      - name: Sync Worker runtime secrets
        working-directory: backend/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler secret bulk "$WORKER_SECRETS_FILE"

      - name: Remove temporary secret payload
        if: ${{ always() }}
        run: |
          if [ -n "${WORKER_SECRETS_FILE:-}" ]; then
            rm -f "$WORKER_SECRETS_FILE"
          fi
